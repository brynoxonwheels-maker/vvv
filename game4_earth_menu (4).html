function readSavedData() {
  // Read both entries before choosing a save, so a higher normal wave in the
  // backup can be recovered from older versions that accidentally saved raid wave 1.
  const candidates = [];
  for (const key of [SAVE_KEY, SAVE_BACKUP_KEY]) {
    try {
      const raw = window.localStorage.getItem(key);
      if (!raw) continue;
      const data = JSON.parse(raw);
      if (data && typeof data === "object") candidates.push(data);
    } catch (e) {
      // Leave damaged entries untouched in case recovery is possible later.
    }
  }
  if (candidates.length) {
    saveStorageAvailable = true;
    const primary = candidates[0];
    const savedNormalWave = Math.max(1, ...candidates.map(d =>
      typeof d.normalWave === "number" && d.normalWave >= 1 ? d.normalWave :
      (typeof d.currentWave === "number" && d.currentWave >= 1 ? d.currentWave : 1)
    ));
    primary.normalWave = savedNormalWave;
    primary.currentWave = savedNormalWave;
    primary.raidWave = Math.max(1, ...candidates.map(d => typeof d.raidWave === "number" && d.raidWave >= 1 ? d.raidWave : 1));
    primary.maxHealth = Math.max(100, ...candidates.map(d => typeof d.maxHealth === "number" && d.maxHealth >= 100 ? d.maxHealth : 100));
    primary.totalKills = Math.max(0, ...candidates.map(d => typeof d.totalKills === "number" && d.totalKills >= 0 ? d.totalKills : 0));
    primary.bossesDefeated = Math.max(0, ...candidates.map(d => typeof d.bossesDefeated === "number" && d.bossesDefeated >= 0 ? d.bossesDefeated : 0));
    primary.unlockedElements = Object.assign({}, ...candidates.map(d => d.unlockedElements || {}));
    for (const d of candidates) {
      for (const key of Object.keys(d.unlockedElements || {})) {
        if (d.unlockedElements[key] === true) primary.unlockedElements[key] = true;
      }
    }
    return primary;
  }
  try {
    const testKey = "purple_circle_save_test";
    window.localStorage.setItem(testKey, "1");
    window.localStorage.removeItem(testKey);
    saveStorageAvailable = true;
  } catch (e) { saveStorageAvailable = false; }
  return null;
}

function saveGameData() {

    version: 5, savedAt: Date.now(), money: money, raidCoins: raidCoins, maxHealth: maxHealth,
    equippedElement: equippedElement, unlockedElements: unlockedElements, raidMaterials: raidMaterials, secretCraftMaterials: secretCraftMaterials, bobTheRockCrafted: bobTheRockCrafted,
    // Keep normal and raid progress separate. Legacy currentWave always means normal mode.
    currentWave: isRaidMode ? normalWave : currentWave,
    normalWave: isRaidMode ? normalWave : currentWave,
    raidWave: isRaidMode ? currentWave : raidWave,
    totalKills: totalKills, bossesDefeated: bossesDefeated, storyTokens: storyTokens, storyUnlockedLevel: storyUnlockedLevel, questData: questData
  });
  try {
    const previous = window.localStorage.getItem(SAVE_KEY);
    if (previous) window.localStorage.setItem(SAVE_BACKUP_KEY, previous);
    window.localStorage.setItem(SAVE_KEY, snapshot);
    saveStorageAvailable = true;
  } catch (e) {
    saveStorageAvailable = false;
  }
}

function spawnBossArenaBoss() {
  const wave = bossArenaWave;
  const variant = wave >= 20 ? 4 : wave >= 15 ? 3 : wave >= 10 ? 2 : wave >= 5 ? 1 : 0;
  const names = ["CASTLE WARDEN", "DREAD KNIGHT", "ASCENDED WARDEN", "DOOM EMPEROR", "ETERNAL OVERLORD"];
  const colors = ["#b24cff", "#ff554f", "#ff9d32", "#e83cff", "#fff0a1"];
  const hp = Math.floor(1800 + wave * 950 + Math.pow(wave, 1.55) * 160);
  const radius = variant >= 3 ? 54 : variant >= 2 ? 48 : 42;
  enemies.push({ id: nextEnemyId++, type:"arenaBoss", isBoss:true, arenaBoss:true, arenaVariant:variant, arenaName:names[variant],
    x:canvas.width*0.68, y:canvas.height*0.5, radius, speed:Math.max(34,75-wave*1.4), baseSpeed:Math.max(34,75-wave*1.4),
    color:colors[variant], damage:wave>=20?30000:wave>=15?15000:wave>=5?5000:45,
    elementalAura:null, maxHealth:hp, health:hp, hitCooldown:0, freezeTimer:0, shootTimer:Math.max(0.65,1.7-wave*0.035),
    arenaAbilityTimer:2.4, arenaDashTimer:3.8, dashTimer:0, dashing:false, teleportTimer:2.5, bouncerState:"approach", bouncerTimer:1.5,
    bouncerAngle:0, bouncerHits:0, pulsePhase:Math.random()*Math.PI*2 });
  enemiesSpawnedCurrentWave=1;
  startCutscene("bossIntro", 2.2, { bossNum:wave, arena:true, name:names[variant] });
  screenShake=0.9;
}

function spawnEnemy() {
  if (isBossArenaMode) { if (!enemies.some(e=>e.arenaBoss)) spawnBossArenaBoss(); return; }
  if (enemiesSpawnedCurrentWave >= enemiesToSpawnThisWave) return;
  if (enemies.length >= MAX_ACTIVE_ENEMIES_ON_SCREEN) return;
  const rand = Math.random();
  let type = "normal", radius = 12, speed = 110, damage = 25;
  let hp = 100 + (currentWave - 1) * 25, color = "#ff3333";
  if (isStoryMode) {
    const lvl = storyLevel; hp = 100 + (lvl-1)*100; speed = 105 + lvl*8; damage = 20 + lvl*10; color = "#ff5555";
    if (lvl >= 2 && rand < 0.28) { type="fast"; radius=10; speed=170+lvl*8; hp=80+lvl*35; color="#ff9b35"; }
    if (lvl >= 3 && rand < 0.14) { type="miniBoss"; radius=25; speed=75; hp=1300; color="#ff4fd8"; }
    if (lvl >= 4 && rand < 0.30) { type="tank"; radius=22; speed=65; hp=2200; color="#3ea663"; }
    if (lvl >= 5) { if(rand < 0.14){type="tank";radius=23;speed=65;hp=2800;color="#3ea663";} else if(rand<0.28){type="bouncer";radius=19;speed=105;hp=1200;color="#ffcf4a";} else if(rand<0.42){type="rusher";radius=14;speed=190;hp=700;color="#dd44dd";} else if(rand<0.52){type="teleporter";radius=17;speed=140;hp=1500;color="#39e8ff";} }
  }
  let isBoss = false, isTank = false, isRusher = false;
  if (isBossWave(currentWave) && !enemies.some(function(e){ return e.isBoss; }) && enemiesSpawnedCurrentWave === 0) {
    isBoss = true; type = "boss"; radius = 40; speed = 60; damage = 40; hp = getBossHp(); color = "#a020f0";
  } else if (currentWave >= 20 && rand < 0.12) {
    type = "teleporter"; radius = 17; speed = 125; damage = 10000; hp = 10000; color = "#39e8ff";
  } else if (currentWave >= 20 && rand < 0.24) {
    type = "bouncer"; radius = 19; speed = 105; damage = 10000; hp = 3500; color = "#ffcf4a";
  } else if (currentWave >= 20 && tanksSpawnedCurrentWave < 5) {
    isTank = true; type = "tank"; radius = 22; speed = 70; damage = 5000;

  refreshQuests(); questData.kills++;

  if (enemy && enemy.isBoss) { bossesDefeated++; startCutscene("bossDefeated", 1.8, {}); screenShake = 0.8; }
  if (isBossArenaMode) {

    }

  }
  if (isStoryMode) {
    storyKills++;

      if (storyLevel < 5) { storyLevel++; storyUnlockedLevel=Math.max(storyUnlockedLevel,storyLevel); currentWave=1; enemies=[]; startWave(); }

  }

    if (isRaidMode && currentWave>=50) questData.raidWave50=true; startWave(); saveGameData();

function damageIcebergBeam(beam, damage) {
  const dx = Math.cos(beam.angle), dy = Math.sin(beam.angle);
  const maxLen = Math.hypot(canvas.width, canvas.height) * 1.5;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const enemy = enemies[i];
    const ex = enemy.x - player.x, ey = enemy.y - player.y;
    const along = ex * dx + ey * dy;
    const across = Math.abs(ex * dy - ey * dx);
    if (along >= 0 && along <= maxLen && across <= 34 + enemy.radius) {
      enemy.health -= damage;
      spawnParticles(enemy.x, enemy.y, 5, "#bff8ff", 190, 0.35, 4);
      if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(i, 1); onEnemyKilled({ isBoss: isB }); }
    }
  }
}

function applyExplosionDamage(x, y, radius, damage) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const enemy = enemies[i];
    if (Math.hypot(x - enemy.x, y - enemy.y) <= radius + enemy.radius) {
      enemy.health -= damage;
      if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(i, 1); onEnemyKilled({ isBoss: isB }); }
    }
  }
}

function nearestEnemyTo(x, y) {
  let best = null, bestD = Infinity;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    const d = (e.x - x) * (e.x - x) + (e.y - y) * (e.y - y);
    if (d < bestD) { bestD = d; best = e; }
  }
  return best;
}

function rollRaidCrate() {
  if (raidCoins < 50) { raidCrateMessage = "Need 50 Raid Coins to roll a crate!"; return; }
  raidCoins -= 50;
  const roll = Math.random();
  if (roll < 0.001) { unlockedElements.boss = true; raidCrateMessage = "BOSS TRANSFORMATION UNLOCKED! (0.1%)"; equippedElement = "boss"; }
  else if (roll < 0.01) { unlockedElements.volcano = true; raidCrateMessage = "VOLCANO UNLOCKED! (0.9%)"; equippedElement = "volcano"; }
  else if (roll < 0.31) { unlockedElements.solar = true; raidCrateMessage = "SOLAR FRUIT UNLOCKED! (30%)"; equippedElement = "solar"; }
  else if (roll < 0.56) { unlockedElements.shadow = true; raidCrateMessage = "SHADOW FRUIT UNLOCKED! (25%)"; equippedElement = "shadow"; }
  else if (roll < 0.76) { unlockedElements.venom = true; raidCrateMessage = "VENOM FRUIT UNLOCKED! (20%)"; equippedElement = "venom"; }
  else if (roll < 0.91) { unlockedElements.diamond = true; raidCrateMessage = "DIAMOND FRUIT UNLOCKED! (15%)"; equippedElement = "diamond"; }
  else { unlockedElements.dragon = true; raidCrateMessage = "DRAGON FRUIT UNLOCKED! (9%)"; equippedElement = "dragon"; }
  saveGameData();
}

function craftBuilder() {
  const cost = { crown: 200, sword: 40, ball: 20, egg: 12, circle: 4 };
  if (unlockedElements.builder) { equippedElement = "builder"; raidCrateMessage = "BUILDER EQUIPPED!"; saveGameData(); return; }
  for (const k of Object.keys(cost)) {
    if ((raidMaterials[k] || 0) < cost[k]) {
      raidCrateMessage = "Need " + cost[k] + " " + k.toUpperCase() + "S to craft Builder!";
      return;
    }
  }
  for (const k of Object.keys(cost)) raidMaterials[k] -= cost[k];
  unlockedElements.builder = true;
  equippedElement = "builder";
  raidCrateMessage = "BUILDER CRAFTED AND EQUIPPED!";
  saveGameData();
}

function adminDamageAll(amount) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const enemy = enemies[i];
    if (!enemy || enemy.isTrainingDummy) continue;
    enemy.health -= amount;
    if (enemy.health <= 0) {
      const isB = enemy.isBoss;
      enemies.splice(i, 1);
      onEnemyKilled({ isBoss: isB });
    }
  }
}

function damageRaidEnemy(enemy, damage) {
  if (!enemy || !enemies.includes(enemy)) return;
  enemy.health -= damage;
  spawnParticles(enemy.x, enemy.y, 7, "#ff6a21", 190, 0.4, 4);
  if (enemy.health <= 0) {
    const isB = enemy.isBoss;
    const idx = enemies.indexOf(enemy);
    if (idx !== -1) { enemies.splice(idx, 1); onEnemyKilled({ isBoss: isB }); }
  }
}

    const innerW = leftPanel.w - 18, innerH = leftPanel.h - 54;
    const cardGap = 7, cardW = (innerW - cardGap * (cols - 1)) / cols;
    const rows = Math.ceil(elems.length / cols), cardH = Math.max(35, (innerH - cardGap * (rows - 1)) / rows);
    for (let i = 0; i < elems.length; i++) {
      const e = elems[i], col = i % cols, row = Math.floor(i / cols);
      const r = { x: innerX + col * (cardW + cardGap), y: innerY + row * (cardH + cardGap), w: cardW, h: cardH };
      const isEq = e.key === "hunt" ? equippedElement === "hunter" : equippedElement === e.key;
      ctx.save();
      ctx.fillStyle = !e.unlocked ? "rgba(10,12,20,0.95)" : (isEq ? e.color : "rgba(44,49,68,0.96)");
      ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 9); ctx.fill();
      ctx.strokeStyle = isEq ? "#fff3b0" : (e.unlocked ? e.color : "#4c5060"); ctx.lineWidth = isEq ? 3 : 1.5; ctx.stroke();
      // Larger fruit/orb icon, with a shine so each selection is easy to spot and tap.
      const rad = Math.min(15, Math.max(9, cardH * 0.24));
      const ix = r.x + (cols >= 4 ? 20 : r.w / 2), iy = r.y + Math.min(r.h / 2, 22);
      const orb = ctx.createRadialGradient(ix - rad * .35, iy - rad * .4, 1, ix, iy, rad * 1.3);
      orb.addColorStop(0, e.unlocked ? "#ffffff" : "#666977"); orb.addColorStop(.28, e.unlocked ? e.color : "#444653"); orb.addColorStop(1, "#171923");
      ctx.fillStyle = orb; ctx.beginPath(); ctx.arc(ix, iy, rad, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = e.unlocked ? "rgba(255,255,255,.85)" : "#656979"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.beginPath(); ctx.arc(ix - rad * .32, iy - rad * .36, Math.max(2, rad * .22), 0, Math.PI * 2); ctx.fill();
      const textX = cols >= 4 ? r.x + 40 : r.x + r.w / 2;
      const maxTextW = cols >= 4 ? r.w - 43 : r.w - 8;
      ctx.fillStyle = e.unlocked ? "#ffffff" : "#8a8c98";
      ctx.font = "bold " + (cardH < 43 ? 9 : 11) + "px Arial";
      ctx.textAlign = "center";
      ctx.fillText(e.name, textX + (cols >= 4 ? maxTextW / 2 - 1 : 0), r.y + (cols >= 4 ? r.h * .37 : r.h * .58), maxTextW);
      ctx.font = "bold 9px Arial";
      const status = e.key === "stat" ? "BOOST" : (!e.unlocked ? e.rate : (isEq ? "EQUIPPED" : "EQUIP"));
      ctx.fillStyle = isEq ? "#fff1a3" : (e.unlocked ? "#c8d0e7" : "#777b89");
      ctx.fillText(status, textX + (cols >= 4 ? maxTextW / 2 - 1 : 0), r.y + (cols >= 4 ? r.h * .72 : r.h * .82), maxTextW);
      ctx.restore();
    }

    if (lastRollResult && gachaState === "idle") {
      ctx.fillStyle = "#ffe28a"; ctx.font = "bold 12px Arial";
      ctx.fillText(lastRollResult, W / 2, H - 43, W - 30);
    }
    // Compact return button stays in the top-right corner, clear of the equipment cards.
    const btnX = W - 104, btnY = 12, btnW = 90, btnH = 34;
    ctx.fillStyle = "#42326e"; ctx.beginPath(); ctx.roundRect(btnX, btnY, btnW, btnH, 9); ctx.fill();
    ctx.strokeStyle = "#c7a8ff"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "#ffffff"; ctx.font = "bold 13px Arial"; ctx.fillText("GAME", btnX + btnW / 2, btnY + btnH / 2);
  }

  // Persistent lobby shortcut, separate from the existing Gacha/return button.
  if (!inHome) {
    const lobbyX = canvas.width - 202, lobbyY = 12, lobbyW = 88, lobbyH = 34;
    ctx.save();
    ctx.fillStyle = "rgba(16,95,76,.96)"; ctx.beginPath(); ctx.roundRect(lobbyX, lobbyY, lobbyW, lobbyH, 9); ctx.fill();
    ctx.strokeStyle = "#9bffdb"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "#ffffff"; ctx.font = "bold 13px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("LOBBY", lobbyX + lobbyW / 2, lobbyY + lobbyH / 2);
    ctx.restore();
  }

  // Death cutscene (drawn on top of everything)
  if (cutscene && cutscene.type === "death") {
    const t = cutscene.timer / cutscene.maxTimer;
    const alpha = Math.min(1, (1 - t) * 2);
    ctx.fillStyle = "rgba(60, 0, 0, " + (alpha * 0.85) + ")";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = "#ff0000"; ctx.shadowBlur = 60;
    ctx.fillStyle = "#ff2222";
    ctx.font = "bold 110px Arial";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("YOU DIED", canvas.width / 2, canvas.height / 2);
    ctx.font = "24px Arial";
    ctx.fillStyle = "#ffaaaa";
    ctx.fillText("returning to lobby...", canvas.width / 2, canvas.height / 2 + 80);
    ctx.restore();
  }
}

function gameLoop(now) {
  const dt = Math.min(Math.max(0, (now - lastTime) / 1000), 0.1);
  lastTime = now;

  // Gacha animation state machine
  if (gachaState !== "idle") {
    gachaTimer -= dt;
    if (gachaState === "shaking" && gachaTimer <= 0) {
      gachaState = "opening";
      gachaTimer = 1.2;
    } else if (gachaState === "opening" && gachaTimer <= 0) {
      gachaState = "reveal";
      gachaTimer = 1.5;
      if (gachaResult) lastRollResult = gachaResult.msg;
    } else if (gachaState === "reveal" && gachaTimer <= 0) {
      gachaState = "idle";
    }
  }

  if (inHome) drawHome();
  else { if (currentScreen !== "rockcraft") update(dt); draw(); }
  requestAnimationFrame(gameLoop);
}

window.addEventListener("mousedown", function (e) {
  // Story's grab/melee is SPACE only; left-click must not activate it.
  if (equippedElement === "story") return;
  if (e.button !== 0 || inHome || isPaused || cutscene || currentScreen !== "game" || equippedElement !== "story") return;
  const rect = canvas.getBoundingClientRect();
  const px = (e.clientX - rect.left) * (canvas.width / Math.max(1, rect.width));
  const py = (e.clientY - rect.top) * (canvas.height / Math.max(1, rect.height));
  // Keep clicks on the Story ability panel from accidentally triggering melee.
  if (px >= 8 && px <= 340 && py >= 80 && py <= 190) return;
  mouse.x = px; mouse.y = py;
  useMelee();
});

window.addEventListener("click", function (e) {
  const rect = canvas.getBoundingClientRect();
  // Convert CSS-pixel pointer coordinates into canvas drawing coordinates so every
  // fruit card hitbox stays aligned if the canvas is scaled by the browser.
  const mx = (e.clientX - rect.left) * (canvas.width / Math.max(1, rect.width));
  const my = (e.clientY - rect.top) * (canvas.height / Math.max(1, rect.height));

  if (inHome) {
    if(menuTransition) return;
    const btnW=Math.min(260,canvas.width*.34),btnH=64,btnX=canvas.width-btnW-Math.max(24,canvas.width*.055);
    const stackHeight=64+10+52+8+46+8+46; const btnY=Math.max(100,Math.min(canvas.height*.30,canvas.height-stackHeight-70));
    const raidY=btnY+btnH+10,raidH=52,storyY=raidY+raidH+8,storyH=46,bossY=storyY+storyH+8,bossH=46;
    const testX=btnX,testY=bossY+bossH+28,testW=btnW,testH=38;
    if(mx>=testX&&mx<=testX+testW&&my>=testY&&my<=testY+testH){beginMenuTransition("test");return;}
    const secretX=18,secretY=canvas.height-54,secretW=48,secretH=36;
    if(mx>=secretX&&mx<=secretX+secretW&&my>=secretY&&my<=secretY+secretH){currentScreen="rockcraft";inHome=false;questNotice="";return;}
    if(mx>=btnX&&mx<=btnX+btnW&&my>=btnY&&my<=btnY+btnH){beginMenuTransition("play");}
    else if(mx>=btnX&&mx<=btnX+btnW&&my>=raidY&&my<=raidY+raidH){beginMenuTransition("raid");}
    else if(mx>=btnX&&mx<=btnX+btnW&&my>=storyY&&my<=storyY+storyH){beginMenuTransition("story");}
    else if(mx>=btnX&&mx<=btnX+btnW&&my>=bossY&&my<=bossY+bossH){beginMenuTransition("boss");}
    return;
  }

  const lobbyX = canvas.width - 202, lobbyY = 12, lobbyW = 88, lobbyH = 34;
  if (!inHome && mx >= lobbyX && mx <= lobbyX + lobbyW && my >= lobbyY && my <= lobbyY + lobbyH) {
    isRaidMode = false; isStoryMode = false; isBossArenaMode = false;
    goToLobby();
    return;
  }

  if (currentScreen === "rockcraft") {
    const cx=canvas.width/2,cy=Math.max(155,canvas.height/2-115),bx=cx-135,by=cy+210,bw=270,bh=42;
    if(mx>=bx&&mx<=bx+bw&&my>=by&&my<=by+bh){
      if(bobTheRockCrafted){questNotice="BOB THE ROCK IS ALREADY CRAFTED!";return;}
      if(secretCraftMaterials.rock<500||secretCraftMaterials.bob<100||secretCraftMaterials.the<5){questNotice="NOT ENOUGH MATERIALS YET!";return;}
      secretCraftMaterials.rock-=500;secretCraftMaterials.bob-=100;secretCraftMaterials.the-=5;bobTheRockCrafted=true;unlockedElements.bobtherock=true;equippedElement="bobtherock";questNotice="BOB THE ROCK CRAFTED AND EQUIPPED! ABILITIES COMING LATER.";saveGameData();return;
    }
    const back={x:cx-105,y:canvas.height-58,w:210,h:40};if(mx>=back.x&&mx<=back.x+back.w&&my>=back.y&&my<=back.y+back.h){currentScreen="game";inHome=true;homeBalls=[];homeFx=[];return;}return;
  }
  if ((!isPaused && currentScreen === "game") || cutscene) return;

  const btnX = canvas.width - 104, btnY = 12, btnW = 90, btnH = 34;
  if(currentScreen==="storygacha"){
    const cards=["vine","nature2","story"],cw=Math.min(160,(canvas.width-50)/3-10),cg=12,total=cw*3+cg*2,startX=(canvas.width-total)/2,cardY=Math.max(145,canvas.height/2-80),ch=190;
    for(let i=0;i<cards.length;i++){const x=startX+i*(cw+cg),y=cardY;if(mx>=x&&mx<=x+cw&&my>=y&&my<=y+ch){const key=cards[i];if(unlockedElements[key]){equippedElement=key;saveGameData();questNotice=key.toUpperCase()+" EQUIPPED!";}else{questNotice="LOCKED! Roll Story Gacha to unlock "+key.toUpperCase()+".";}return;}}
    const bx=canvas.width/2-110,by=canvas.height-145;if(mx>=bx&&mx<=bx+220&&my>=by&&my<=by+50){if(storyTokens<500){questNotice="Need 500 Story Tokens!";return;}storyTokens-=500;const r=Math.random()*100;let key;if(r<1){key="story";}else if(r<50.5){key="vine";}else{key="nature2";}unlockedElements[key]=true;equippedElement=key;questNotice="STORY GACHA: "+({story:"STORY (1%)",vine:"VINE (49.5%)",nature2:"NATURE V2 (49.5%)"}[key]);saveGameData();return;}if(mx>=canvas.width/2-80&&mx<=canvas.width/2+80&&my>=canvas.height-78&&my<=canvas.height-36){currentScreen="raidshop";return;}return;
  }
  if (currentScreen === "raidshop") {
    const raidShopFruits=["solar","shadow","venom","diamond","dragon","volcano","boss","lava","builder"];const rw=Math.min(132,(canvas.width-60)/4-8),rh=44,rg=6,rx=(canvas.width-(rw*4+rg*3))/2,ry=158;
    for(let i=0;i<raidShopFruits.length;i++){const x=rx+(i%4)*(rw+rg),y=ry+Math.floor(i/4)*(rh+rg);if(mx>=x&&mx<=x+rw&&my>=y&&my<=y+rh){const k=raidShopFruits[i];if(unlockedElements[k]){equippedElement=k;saveGameData();raidCrateMessage=k.toUpperCase()+" EQUIPPED!";}else{raidCrateMessage="Roll the Raid Gacha to unlock "+k.toUpperCase()+".";}return;}}
    const crate = { x: canvas.width / 2 - 130, y: Math.max(ry+rh*3+rg*2+12, canvas.height / 2 - 5), w: 260, h: 48 };
    if (mx >= crate.x && mx <= crate.x + crate.w && my >= crate.y && my <= crate.y + crate.h) { rollRaidCrate(); return; }
    const craftBtn = { x: canvas.width / 2 - 130, y: Math.min(crate.y + 76, canvas.height - 142), w: 260, h: 36 };
    if (mx >= craftBtn.x && mx <= craftBtn.x + craftBtn.w && my >= craftBtn.y && my <= craftBtn.y + craftBtn.h) { currentScreen = "craftgacha"; return; }
    const back = { x: canvas.width / 2 - 90, y: canvas.height - 95, w: 180, h: 48 };
    if (mx >= back.x && mx <= back.x + back.w && my >= back.y && my <= back.y + back.h) currentScreen = "game";
    return;
  }
  if (currentScreen === "craftgacha") {
    const cardW=Math.min(390,canvas.width-40),cardH=230,cardX=(canvas.width-cardW)/2,cardY=195;
    const craftAction={x:canvas.width/2-135,y:cardY+185,w:270,h:38};
    if(mx>=craftAction.x&&mx<=craftAction.x+craftAction.w&&my>=craftAction.y&&my<=craftAction.y+craftAction.h){craftBuilder();return;}
    const craftBack={x:canvas.width/2-100,y:canvas.height-55,w:200,h:40};
    if(mx>=craftBack.x&&mx<=craftBack.x+craftBack.w&&my>=craftBack.y&&my<=craftBack.y+craftBack.h){currentScreen="raidshop";return;}
    return;
  }
  if (currentScreen === "gacha" && mx >= canvas.width - 104 && mx <= canvas.width - 14 && my >= 12 && my <= 46) {
    currentScreen = "game"; gachaState = "idle"; return;
  }
  if (currentScreen === "game" && mx >= btnX && mx <= btnX + btnW && my >= btnY && my <= btnY + btnH) {

  } else if (currentScreen !== "game" && mx >= btnX && mx <= btnX + btnW && my >= btnY && my <= btnY + btnH) {
    currentScreen = "game"; gachaState = "idle"; return;
  }
  if (currentScreen === "game") {
    const qx=canvas.width-225,qy=canvas.height-205;if(mx>=qx+8&&mx<=qx+202&&my>=qy+132&&my<=qy+164){refreshQuests();claimQuest(0);claimQuest(1);claimQuest(2);return;}
    const shopY = btnY + btnH + 8;
    if (mx >= btnX && mx <= btnX + btnW && my >= shopY && my <= shopY + btnH) { currentScreen = "raidshop"; return; }
    const storyShopY = shopY + btnH + 8;
    if (mx >= btnX && mx <= btnX + btnW && my >= storyShopY && my <= storyShopY + btnH) { currentScreen = "storygacha"; return; }
  }
  if (currentScreen === "gacha" && gachaState === "idle") {
    const W = canvas.width, H = canvas.height, cx = W / 2;
    const rollY = 123, rollW = Math.min(155, Math.max(95, (W - 50) / 3.2)), rollH = 38, rollGap = 10;
    const rollBtn = { x: cx - rollW * 1.5 - rollGap, y: rollY, w: rollW, h: rollH };
    const fastRollBtn = { x: cx - rollW / 2, y: rollY, w: rollW, h: rollH };
    const fastTenRollBtn = { x: cx + rollW / 2 + rollGap, y: rollY, w: rollW, h: rollH };
    if (mx >= rollBtn.x && mx <= rollBtn.x + rollBtn.w && my >= rollBtn.y && my <= rollBtn.y + rollBtn.h) { rollGacha(false); return; }
    if (mx >= fastRollBtn.x && mx <= fastRollBtn.x + fastRollBtn.w && my >= fastRollBtn.y && my <= fastRollBtn.y + fastRollBtn.h) {
      rollGacha(true); return;
    }
    if (mx >= fastTenRollBtn.x && mx <= fastTenRollBtn.x + fastTenRollBtn.w && my >= fastTenRollBtn.y && my <= fastTenRollBtn.y + fastTenRollBtn.h) {
      rollGachaTenFast(); return;
    }
    const panelTop = 193, panelBottom = H - 57, panelH = Math.max(120, panelBottom - panelTop);
    const margin = 18;
    const leftPanel = { x: margin, y: panelTop, w: W - margin * 2, h: panelH };
    // Keep this order exactly matched to the rendered card list above; otherwise
    // every card after a missing entry gets the wrong click hitbox.
    const elems = ["sand", "smoke", "stat", "grass", "kai", "bomb", "flame", "lightning", "dune", "crimson", "nickson", "mechanic", "blizzard", "nature", "buh", "voltage", "hunt", "carter", "carterv2", "polar", "cosmic", "buhv2", "blackhole", "iceberg", "voidemperor", "chronos", "polarius", "admin", "fullpower"];
    const cols = W < 620 ? 3 : 6;
    const innerX = leftPanel.x + 9, innerY = leftPanel.y + 45, innerW = leftPanel.w - 18, innerH = leftPanel.h - 54;
    const cardGap = 7, cardW = (innerW - cardGap * (cols - 1)) / cols, rows = Math.ceil(elems.length / cols);
    const cardH = Math.max(35, (innerH - cardGap * (rows - 1)) / rows);
    if (mx >= leftPanel.x && mx <= leftPanel.x + leftPanel.w && my >= innerY && my <= innerY + innerH) {
      for (let i = 0; i < elems.length; i++) {
        const col = i % cols, row = Math.floor(i / cols);
        const r = { x: innerX + col * (cardW + cardGap), y: innerY + row * (cardH + cardGap), w: cardW, h: cardH };
        if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) {
          const k = elems[i], actual = k === "hunt" ? "hunter" : k;
          // STAT is a one-time health boost, not an equipable ability.
          if (actual !== "stat" && (actual === "sand" || unlockedElements[actual])) { equippedElement = actual; saveGameData(); }
          return;
        }
      }
    }
  }
});

window.addEventListener("keydown", function (e) {
  if (inHome) return;
  const k = e.key.toLowerCase();
  if(k==="h" && equippedElement==="story" && !isPaused && !cutscene && storyHCooldown<=0){storyHCooldown=0.5;applyExplosionDamage(player.x,player.y,190,3000);spawnParticles(player.x,player.y,28,"#ff67d7",260,.45,4);e.preventDefault();return;}
  if (k === "1") {
    isPaused = !isPaused;
    if (!isPaused) currentScreen = "game";
    e.preventDefault();
    return;
  }
  if (cutscene) return;
  if (k in keys) { keys[k] = true; e.preventDefault(); }
  if (k === "g") { useGAbility(); e.preventDefault(); }
  if (k === "f") { useFAbility(); e.preventDefault(); }
  if (k === "v") { useVBoost(); e.preventDefault(); }
  if (k === " " || k === "spacebar" || e.code === "Space") { useMelee(); e.preventDefault(); }
});

window.addEventListener("keyup", function (e) {
  const k = e.key.toLowerCase();
  if (k in keys) { keys[k] = false; e.preventDefault(); }
});

requestAnimationFrame(gameLoop);
</script>
